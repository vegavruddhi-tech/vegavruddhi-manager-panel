<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a4731" />
    <meta name="description" content="Vegavruddhi Manager Panel - Team Oversight Portal" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo-192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vegavruddhi Mgr" />
    
    <!-- Prevent Token Exposure via Referer Leakage & Browser History -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      (function() {
        try {
          var search = window.location.search;
          var hash = window.location.hash;
          var searchParams = new URLSearchParams(search);
          var hashParams = hash ? new URLSearchParams(hash.substring(1)) : null;

          var token = searchParams.get('token') || searchParams.get('adminToken') || 
                      (hashParams ? (hashParams.get('token') || hashParams.get('adminToken')) : null);
          var viewAs = searchParams.get('viewAs') || (hashParams ? hashParams.get('viewAs') : null);

          if (token) {
            var isJwtStructure = token.indexOf('.') !== -1 && token.split('.').length === 3;
            if (isJwtStructure) {
              sessionStorage.setItem('mgr_impersonationToken', token);
              localStorage.setItem('token', token);
              if (viewAs) {
                sessionStorage.setItem('mgr_viewAsEmail', viewAs);
                localStorage.setItem('viewAsEmail', viewAs);
                localStorage.setItem('isImpersonating', 'true');
              }
            }

            // Immediately strip token from URL so it's not leaked via Referer or saved in browser history
            searchParams.delete('token');
            searchParams.delete('adminToken');
            if (viewAs) searchParams.delete('viewAs');

            var cleanSearch = searchParams.toString();
            var cleanUrl = window.location.pathname + (cleanSearch ? '?' + cleanSearch : '');
            window.history.replaceState(null, document.title, cleanUrl);
          }
        } catch (e) {
          console.error('URL token sanitization error:', e);
        }
      })();
    </script>
    <title>Vegavruddhi – Manager Portal</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
